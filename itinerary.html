<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week Itinerary — Semester Zero Innovation Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cardinal:#B91E2B;
    --cardinal-deep:#7F141D;
    --ink:#1A1712;
    --stone:#F4EEE3;
    --parchment:#FBF7EF;
    --brass:#C9A24B;
    --brass-soft:#E4CC8B;
    --mercury:#E7E1D4;
    --ok:#3F6B4A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 800px at 15% -10%, rgba(185,30,43,0.10), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(201,162,75,0.14), transparent 55%),
      var(--stone);
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:36px 16px 60px;
  }
  .stage{
    width:100%;
    max-width:760px;
  }

  .brandbar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:22px;
    color:var(--cardinal-deep);
    letter-spacing:.16em;
    font-size:11.5px;
    font-weight:600;
    text-transform:uppercase;
  }
  .brandbar::before, .brandbar::after{
    content:"";
    height:1px;
    width:38px;
    background:linear-gradient(90deg, transparent, var(--brass), transparent);
  }

  .hero{
    text-align:center;
    margin-bottom:26px;
  }
  .hero .kicker{
    font-size:12px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--brass-soft);
    background:var(--ink);
    display:inline-block;
    padding:6px 14px;
    border-radius:20px;
    font-weight:700;
    margin-bottom:14px;
  }
  .hero h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(30px,6vw,44px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .hero p{
    margin:0;
    color:#5b5648;
    font-size:15px;
    line-height:1.55;
    max-width:480px;
    margin:0 auto;
  }

  /* ---- week progress dots ---- */
  .weekbar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:26px 0 20px;
  }
  .weekdot{
    width:10px;height:10px;border-radius:50%;
    background:var(--mercury);
    transition:all .3s ease;
    cursor:pointer;
  }
  .weekdot.active{
    background:var(--cardinal);
    transform:scale(1.35);
  }
  .weekdot.passed{
    background:var(--brass);
  }

  /* ---- tabs ---- */
  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:22px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    background:#fff;
    border:1.5px solid var(--mercury);
    border-radius:14px;
    padding:10px 16px;
    cursor:pointer;
    text-align:left;
    transition:all .2s ease;
    min-width:104px;
  }
  .tab .tnum{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:20px;
    color:var(--cardinal-deep);
    line-height:1;
  }
  .tab .tlabel{
    font-size:11px;
    color:#8a8474;
    font-weight:600;
    letter-spacing:.02em;
    margin-top:3px;
  }
  .tab:hover{border-color:var(--brass);}
  .tab.active{
    background:var(--ink);
    border-color:var(--ink);
  }
  .tab.active .tnum{color:var(--brass-soft);}
  .tab.active .tlabel{color:#d8d2c2;}

  /* ---- day card ---- */
  .card{
    background:var(--parchment);
    border-radius:22px;
    padding:36px 34px 32px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 30px 60px -20px rgba(26,23,18,0.30),
      0 2px 0 var(--brass);
    border:1px solid rgba(201,162,75,0.35);
    position:relative;
    overflow:hidden;
  }

  .day-head{
    margin-bottom:6px;
  }
  .day-eyebrow{
    font-size:11.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--cardinal-deep);
    font-weight:700;
  }
  .day-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(24px,5vw,32px);
    margin:4px 0 6px;
    color:var(--ink);
  }
  .day-theme{
    font-size:14.5px;
    font-style:italic;
    color:#6b6555;
    margin-bottom:22px;
  }

  /* ---- timeline ---- */
  .timeline{
    position:relative;
    padding-left:26px;
    border-left:2px dashed var(--mercury);
    margin-left:6px;
  }
  .titem{
    position:relative;
    padding-bottom:24px;
    opacity:0;
    transform:translateX(-10px);
  }
  .titem.animate-in{
    animation:slideIn .5s cubic-bezier(.22,1,.36,1) forwards;
  }
  .titem:last-child{padding-bottom:4px;}
  @keyframes slideIn{ to{opacity:1; transform:translateX(0);} }

  .titem::before{
    content:"";
    position:absolute;
    left:-31.5px;
    top:4px;
    width:11px;height:11px;
    border-radius:50%;
    background:var(--cardinal);
    border:3px solid var(--parchment);
    box-shadow:0 0 0 2px var(--brass);
  }

  .titem-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .titem-focus{
    font-weight:700;
    font-size:16px;
    color:var(--ink);
  }
  .titem-duration{
    font-size:11.5px;
    font-weight:700;
    color:var(--cardinal-deep);
    background:rgba(185,30,43,0.08);
    border-radius:20px;
    padding:3px 11px;
    white-space:nowrap;
  }
  .titem-desc{
    font-size:14.5px;
    line-height:1.55;
    color:#5b5648;
    margin-top:5px;
  }

  /* ---- footer summary ---- */
  .day-summary{
    margin-top:26px;
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
  }
  .total-chip{
    background:var(--ink);
    color:var(--brass-soft);
    font-size:12.5px;
    font-weight:700;
    padding:8px 15px;
    border-radius:30px;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .deliverable-card{
    flex:1;
    min-width:220px;
    background:linear-gradient(135deg, rgba(201,162,75,0.16), rgba(185,30,43,0.06));
    border:1.5px solid var(--brass);
    border-radius:14px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .deliverable-card svg{flex-shrink:0;}
  .deliverable-label{
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--cardinal-deep);
    font-weight:700;
    margin-bottom:2px;
  }
  .deliverable-text{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    line-height:1.35;
  }

  /* nav arrows */
  .daynav{
    display:flex;
    justify-content:space-between;
    margin-top:24px;
  }
  .navbtn{
    background:none;
    border:1.5px solid var(--ink);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:10px 18px;
    border-radius:30px;
    cursor:pointer;
    transition:background .2s, color .2s;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .navbtn:hover:not(:disabled){
    background:var(--ink);
    color:var(--parchment);
  }
  .navbtn:disabled{
    opacity:0.3;
    cursor:default;
  }

  footer{
    text-align:center;
    margin-top:26px;
    font-size:12px;
    color:#a39d8c;
    letter-spacing:.03em;
  }

  @media (max-width:520px){
    .card{padding:28px 20px 26px;}
    .timeline{padding-left:20px;}
    .titem::before{left:-25.5px;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="brandbar">Bangor University · Semester Zero</div>

  <div class="hero">
    <span class="kicker">Full Week Schedule</span>
    <h1>Innovation Sprint Itinerary</h1>
    <p>Six days, one journey — from your very first team huddle to the final showcase. Here's exactly what each day holds.</p>
  </div>

  <div class="weekbar" id="weekbar"></div>
  <div class="tabs" id="tabs"></div>

  <div class="card" id="dayCard"></div>

  <div class="daynav">
    <button class="navbtn" id="prevBtn">← Previous day</button>
    <button class="navbtn" id="homeBtn" onclick="window.location.href='index.html'">
    Go to Home
</button>    <button class="navbtn" id="nextBtn">Next day →</button>
  </div>

  <footer>ING College of Innovation and Leadership · Programme Closing Event</footer>
</div>

<script>
const DAYS = [
  {
    label:"Kickoff",
    title:"Day 1 — Kickoff & Discovery",
    theme:"Set the stage, form teams, decide on the theme for the event",
    total:"4.5 Hours",
    deliverable:"Theme for the event",
    items:[
      {focus:"Opening & Challenge Briefing", desc:"Innovation Sprint introduction, team formation, decide roles, briefing on expectations."},
      {focus:"Research & Problem Analysis", desc:"Problem exploration, user analysis, evidence gathering for the selected themes, including inquiry and discussion activities, surveys if applicable."},
      {focus:"Primary and Secondary Theme Lock-in", desc:"Teams draft and present one-line problem statements for the primary and secondary themes to mentors for sign-off and complete the Google Form to finalize their selection."}
    ]
  },
  {
    label:"Ideation",
    title:"Day 2 — Ideation & Concept Development",
    theme:"Go wide, then converge on one strong concept",
    total:"4.5 Hours",
    deliverable:"Locked concept, ready for building",
    items:[
      {focus:"Confirmation on the Finalized Theme", desc:"Mentors will give reflections on the selected themes for each group.", duration:"30 Min"},
      {focus:"Brainstorming & Solution Mapping", desc:"Divergent ideation, solution mapping exercises.", duration:"1 Hour"},
      {focus:"Feasibility Analysis", desc:"Innovation workshops, evaluating ideas against feasibility/impact.", duration:"1.5 Hours"},
      {focus:"Concept Development & Pitch", desc:"Teams refine one chosen concept and pitch it to mentors for a go/no-go check.", duration:"1 Hour"}
    ]
  },
  {
    label:"Build I",
    title:"Day 3 — Build Day 1: Foundation",
    theme:"Turn the concept into a working structure",
    total:"6.25 Hours",
    deliverable:"Working core prototype (rough but functional)",
    items:[
      {focus:"Workflow & Architecture", desc:"Mapping out the build plan, workflow/user-flow creation, and task division within teams.", duration:"1 Hour"},
      {focus:"Core Build", desc:"Prototype/mock-up development, building the core functionality first.", duration:"3 Hours"},
      {focus:"Mentor Check-in", desc:"Mid-build mentor feedback round and troubleshooting.", duration:"45 Min"},
      {focus:"Continued Build", desc:"Iterative improvement based on mentor feedback.", duration:"1.5 Hours"}
    ]
  },
  {
    label:"Build II",
    title:"Day 4 — Build Day 2: Refinement",
    theme:"Polish the build into something demo-ready",
    total:"5.25 Hours",
    deliverable:"Demo-ready prototype, fully signed off",
    items:[
      {focus:"Refinement & Iteration", desc:"Bug fixing, edge-case handling, and feature polish based on Day 3 feedback.", duration:"2.5 Hours"},
      {focus:"Final Mentor Review", desc:"Final checkpoint with mentors — build is signed off as demo-ready.", duration:"45 Min"},
      {focus:"Final Build Push", desc:"Last fixes, packaging the prototype/mock-up for demoing, and testing under demo conditions.", duration:"2 Hours"}
    ]
  },
  {
    label:"Rehearsal",
    title:"Day 5 — Rehearsal & Showcase Prep",
    theme:"Turn the build into a story, and pressure-test everything before showcase day",
    total:"5.75 Hours",
    deliverable:"Rehearsed, polished pitch, team fully showcase-ready",
    items:[
      {focus:"Presentation & Storytelling Prep", desc:"Building slides/demo flow, crafting the narrative, and assigning speaking roles.", duration:"1.5 Hours"},
      {focus:"First Run-through", desc:"Full practice run per team, timed.", duration:"1 Hour"},
      {focus:"Peer & Mentor Feedback Round", desc:"Teams present to mentors/peers and receive feedback on pitch and delivery.", duration:"1 Hour"},
      {focus:"Final Polish & Buffer", desc:"Incorporating feedback, fixing any last-minute technical issues, and contingency time.", duration:"1.5 Hours"},
      {focus:"Rehearsal", desc:"Final full run-through and logistics walkthrough for showcase day (staging, order, timing).", duration:"45 Min"}
    ]
  },
  {
    label:"Showcase",
    title:"Day 6 — Presentation, Showcase & Semester Zero Closing",
    theme:"Show it off, reflect, and celebrate the semester",
    total:"6 Hours",
    deliverable:"Completed showcase, certificates awarded, semester formally closed",
    items:[
      {focus:"Final Setup", desc:"Booth/stage setup, tech checks, and last-minute touches.", duration:"1 Hour"},
      {focus:"Showcase", desc:"Friends and family members will be invited to attend the showcase and explore the participants' work and achievements.", duration:"4 Hours"},
      {focus:"Semester Zero Closing Ceremony", desc:"Certificate distribution and closing remarks.", duration:"1 Hour"}
    ]
  }
];

let activeDay = 0;

const tabsEl = document.getElementById('tabs');
const weekbarEl = document.getElementById('weekbar');
const cardEl = document.getElementById('dayCard');
const prevBtn = document.getElementById('prevBtn');
const homeBtn = document.getElementById('homeBtn');
const nextBtn = document.getElementById('nextBtn');

function trophyIcon(){
  return `<svg width="26" height="26" viewBox="0 0 24 24" fill="none">
    <path d="M7 4h10v4a5 5 0 0 1-10 0V4Z" stroke="#7F141D" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M7 5H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4" stroke="#7F141D" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M17 5h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4" stroke="#7F141D" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M12 13v3" stroke="#7F141D" stroke-width="1.6"/>
    <path d="M8 20h8" stroke="#7F141D" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M9.5 16.5h5L15 20H9l.5-3.5Z" stroke="#7F141D" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>`;
}

function renderTabs(){
  tabsEl.innerHTML = DAYS.map((d, i) =>
    `<div class="tab ${i===activeDay?'active':''}" data-idx="${i}">
       <div class="tnum">Day ${i+1}</div>
       <div class="tlabel">${d.label}</div>
     </div>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => goToDay(parseInt(el.getAttribute('data-idx'), 10)));
  });
}

function renderWeekbar(){
  weekbarEl.innerHTML = DAYS.map((d, i) =>
    `<div class="weekdot ${i===activeDay ? 'active' : (i<activeDay ? 'passed':'')}" data-idx="${i}" title="Day ${i+1}: ${d.label}"></div>`
  ).join('');
  weekbarEl.querySelectorAll('.weekdot').forEach(el => {
    el.addEventListener('click', () => goToDay(parseInt(el.getAttribute('data-idx'), 10)));
  });
}

function renderDay(){
  const d = DAYS[activeDay];
  cardEl.innerHTML = `
    <div class="day-head">
      <div class="day-eyebrow">Day ${activeDay+1} of ${DAYS.length}</div>
      <div class="day-title">${d.title.replace(/^Day \d+ — /,'')}</div>
      <div class="day-theme">${d.theme}</div>
    </div>
    <div class="timeline" id="timeline">
      ${d.items.map((it,i) => `
        <div class="titem" style="animation-delay:${0.08*i}s" data-order="${i}">
          <div class="titem-head">
            <div class="titem-focus">${it.focus}</div>
            ${it.duration ? `<div class="titem-duration">${it.duration}</div>` : ``}
          </div>
          <div class="titem-desc">${it.desc}</div>
        </div>
      `).join('')}
    </div>
    <div class="day-summary">
      <div class="total-chip">Day Total · ${d.total}</div>
      <div class="deliverable-card">
        ${trophyIcon()}
        <div>
          <div class="deliverable-label">End-of-day deliverable</div>
          <div class="deliverable-text">${d.deliverable}</div>
        </div>
      </div>
    </div>
  `;

  requestAnimationFrame(() => {
    cardEl.querySelectorAll('.titem').forEach(el => el.classList.add('animate-in'));
  });

  prevBtn.disabled = activeDay === 0;n
  nextBtn.disabled = activeDay === DAYS.length - 1;
  nextBtn.textContent = activeDay === DAYS.length - 1 ? 'Final day ✓' : 'Next day →';
}

function goToDay(idx){
  if(idx < 0 || idx >= DAYS.length) return;
  activeDay = idx;
  renderTabs();
  renderWeekbar();
  renderDay();
  const activeTab = tabsEl.querySelector('.tab.active');
  if(activeTab) activeTab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

prevBtn.addEventListener('click', () => goToDay(activeDay - 1));
nextBtn.addEventListener('click', () => goToDay(activeDay + 1));

renderTabs();
renderWeekbar();
renderDay();
</script>
</body>
</html>
